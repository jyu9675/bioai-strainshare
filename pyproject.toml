[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strainshare"
version = "0.1.0"
description = "A standardized, contamination-aware framework for cross-body-site bacterial strain sharing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jean Yu" }, { name = "Douglas S. Kwon" }]
keywords = ["metagenomics", "strain-sharing", "microbiome", "inStrain", "popANI",
            "cervicovaginal", "gut microbiome", "transmission"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pandas>=1.3",
  "numpy>=1.20",
  "matplotlib>=3.4",
  "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jyu9675/bioai-strainshare"
Repository = "https://github.com/jyu9675/bioai-strainshare"

[project.scripts]
strainshare = "strainshare.cli:main"

[tool.setuptools]
packages = ["strainshare"]

[tool.setuptools.package-data]
strainshare = ["strainshare_standard.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
