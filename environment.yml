# Bioinformatics stack for the strain-sharing pilot (steps 02-04, 07).
# Create on WSL2 / Linux / HPC (NOT native Windows -- these tools are Unix-only):
#   conda env create -f environment.yml
#   conda activate bioai
# Then run scripts/check_env.sh to confirm, and scripts/01..07.
#
# The pure-Python analysis half (00, 05, 06, smoke_test) also runs in this env,
# and on plain Windows with just: conda install pandas numpy matplotlib
name: bioai
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  # mapping / reference
  - bowtie2
  - samtools
  - drep          # provides dRep + parse_stb.py
  # strain + composition
  # NOTE: bioconda's instrain is ancient (1.3.4) and crashes on modern Biopython
  # (ModuleNotFoundError: Bio.codonalign.codonalphabet). After creating the env, upgrade via pip:
  #   pip install --upgrade instrain   # -> instrain 1.10.0 + biopython 1.74
  - instrain
  - metaphlan>=4
  # analysis / plotting
  - pandas
  - numpy
  - matplotlib
  # download utils
  - wget
  - curl
  - sra-tools     # prefetch/fasterq-dump, alternative to ENA download
